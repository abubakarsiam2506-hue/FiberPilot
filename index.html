<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FiberPilot</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}
button,input,select{font:inherit}
button{cursor:pointer}

.hidden{display:none!important}

.login-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#eef3f9;
}

.login-card{
  width:100%;
  max-width:420px;
  background:white;
  padding:32px;
  border-radius:18px;
  box-shadow:0 10px 35px rgba(0,0,0,.08);
}

.logo{
  font-size:30px;
  font-weight:800;
  margin-bottom:8px;
}

.muted{color:#667085}

.field{
  margin-top:16px;
}

.field label{
  display:block;
  font-weight:600;
  margin-bottom:7px;
}

.field input,.field select{
  width:100%;
  padding:12px;
  border:1px solid #d7dce5;
  border-radius:9px;
  outline:none;
}

.primary{
  width:100%;
  margin-top:20px;
  padding:13px;
  border:0;
  border-radius:9px;
  background:#2563eb;
  color:white;
  font-weight:700;
}

.primary:hover{opacity:.92}

.error{
  margin-top:14px;
  color:#b42318;
  background:#fef3f2;
  padding:10px;
  border-radius:8px;
}

.app{
  min-height:100vh;
}

.topbar{
  height:64px;
  background:#111827;
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
}

.brand{
  font-size:22px;
  font-weight:800;
}

.user-area{
  display:flex;
  align-items:center;
  gap:12px;
}

.logout{
  border:1px solid #475467;
  background:transparent;
  color:white;
  padding:8px 13px;
  border-radius:8px;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:24px;
}

.company{
  margin-bottom:22px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
}

.card{
  background:white;
  border-radius:14px;
  padding:20px;
  box-shadow:0 3px 15px rgba(0,0,0,.05);
}

.card-title{
  color:#667085;
  font-size:14px;
}

.number{
  margin-top:8px;
  font-size:30px;
  font-weight:800;
}

.section{
  margin-top:24px;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.add-btn{
  border:0;
  background:#2563eb;
  color:white;
  padding:10px 15px;
  border-radius:8px;
  font-weight:700;
}

.table-wrap{
  overflow:auto;
  background:white;
  border-radius:14px;
  box-shadow:0 3px 15px rgba(0,0,0,.05);
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:700px;
}

th,td{
  padding:13px 15px;
  text-align:left;
  border-bottom:1px solid #eaecf0;
}

th{
  font-size:13px;
  color:#667085;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal-card{
  width:100%;
  max-width:500px;
  background:white;
  padding:25px;
  border-radius:15px;
}

.modal-actions{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.cancel{
  flex:1;
  border:1px solid #d0d5dd;
  background:white;
  padding:11px;
  border-radius:8px;
}

.save{
  flex:1;
  border:0;
  background:#2563eb;
  color:white;
  padding:11px;
  border-radius:8px;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  background:#ecfdf3;
  color:#027a48;
  font-size:12px;
  font-weight:700;
}

@media(max-width:800px){
  .grid{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:500px){
  .grid{grid-template-columns:1fr}
  .container{padding:15px}
  .topbar{padding:0 14px}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="login-page">
  <div class="login-card">
    <div class="logo">FiberPilot</div>
    <div class="muted">Fiber Network Management</div>

    <div class="field">
      <label>Email</label>
      <input id="email" type="email" placeholder="admin@example.com">
    </div>

    <div class="field">
      <label>Password</label>
      <input id="password" type="password" placeholder="Password">
    </div>

    <button class="primary" onclick="login()">Login</button>

    <div id="loginError" class="error hidden"></div>
  </div>
</div>


<!-- APP -->
<div id="app" class="app hidden">

  <div class="topbar">
    <div class="brand">FiberPilot</div>

    <div class="user-area">
      <span id="userName"></span>
      <button class="logout" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="container">

    <div class="company">
      <h1 id="companyName">Dashboard</h1>
      <div class="muted">
        Logged in as <strong id="roleName"></strong>
      </div>
    </div>

    <!-- STATS -->
    <div class="grid">

      <div class="card">
        <div class="card-title">Fiber Points</div>
        <div id="pointCount" class="number">0</div>
      </div>

      <div class="card">
        <div class="card-title">Fiber Boxes</div>
        <div id="boxCount" class="number">0</div>
      </div>

      <div class="card">
        <div class="card-title">Fiber Lines</div>
        <div id="lineCount" class="number">0</div>
      </div>

      <div class="card">
        <div class="card-title">Role</div>
        <div id="dashboardRole" class="number" style="font-size:22px">-</div>
      </div>

    </div>


    <!-- FIBER POINTS -->
    <div class="section">

      <div class="section-head">
        <h2>Fiber Points</h2>
        <button class="add-btn" onclick="openPointModal()">+ Add Point</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Type</th>
              <th>Fiber Code</th>
              <th>Cores</th>
              <th>Status</th>
            </tr>
          </thead>

          <tbody id="pointsTable"></tbody>
        </table>
      </div>

    </div>


    <!-- FIBER LINES -->
    <div class="section">

      <div class="section-head">
        <h2>Fiber Lines</h2>
        <button class="add-btn" onclick="openLineModal()">+ Add Line</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Fiber Code</th>
              <th>Cores</th>
              <th>Length</th>
              <th>Status</th>
            </tr>
          </thead>

          <tbody id="linesTable"></tbody>
        </table>
      </div>

    </div>

  </div>
</div>


<!-- POINT MODAL -->
<div id="pointModal" class="modal hidden">
  <div class="modal-card">

    <h2>Add Fiber Point</h2>

    <div class="field">
      <label>Name</label>
      <input id="pointName" placeholder="Example: Box 01">
    </div>

    <div class="field">
      <label>Type</label>
      <select id="pointType">
        <option>Fiber Box</option>
        <option>OLT</option>
        <option>POP</option>
        <option>Joint</option>
        <option>Other</option>
      </select>
    </div>

    <div class="field">
      <label>Fiber Code</label>
      <input id="pointCode" placeholder="FB-001">
    </div>

    <div class="field">
      <label>Total Cores</label>
      <input id="pointCores" type="number" value="0">
    </div>

    <div class="modal-actions">
      <button class="cancel" onclick="closePointModal()">Cancel</button>
      <button class="save" onclick="savePoint()">Save</button>
    </div>

  </div>
</div>


<!-- LINE MODAL -->
<div id="lineModal" class="modal hidden">
  <div class="modal-card">

    <h2>Add Fiber Line</h2>

    <div class="field">
      <label>Name</label>
      <input id="lineName" placeholder="Example: Main Line 01">
    </div>

    <div class="field">
      <label>Fiber Code</label>
      <input id="lineCode" placeholder="FL-001">
    </div>

    <div class="field">
      <label>Total Cores</label>
      <input id="lineCores" type="number" value="0">
    </div>

    <div class="field">
      <label>Length (meters)</label>
      <input id="lineLength" type="number" value="0">
    </div>

    <div class="modal-actions">
      <button class="cancel" onclick="closeLineModal()">Cancel</button>
      <button class="save" onclick="saveLine()">Save</button>
    </div>

  </div>
</div>


<script>
/* ==========================================
   SUPABASE CONFIG
========================================== */

const SUPABASE_URL =
  "https://traojcygtyfsgieqqvel.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_mVJt4eQbd_noOUjtXinLYA_JWSAM1rT";

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* ==========================================
   GLOBAL DATA
========================================== */

let currentUser = null;
let currentProfile = null;


/* ==========================================
   START APP
========================================== */

document.addEventListener("DOMContentLoaded", async () => {

  const {
    data: { session }
  } = await client.auth.getSession();

  if (session) {
    await loadUser(session.user);
  } else {
    showLogin();
  }

});


/* ==========================================
   LOGIN
========================================== */

async function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const errorBox =
    document.getElementById("loginError");

  errorBox.classList.add("hidden");

  if (!email || !password) {
    errorBox.textContent =
      "Email and password are required.";
    errorBox.classList.remove("hidden");
    return;
  }

  const {
    data,
    error
  } = await client.auth.signInWithPassword({
    email,
    password
  });

  if (error) {

    errorBox.textContent = error.message;
    errorBox.classList.remove("hidden");

    return;
  }

  await loadUser(data.user);
}


/* ==========================================
   LOAD USER
========================================== */

async function loadUser(user) {

  currentUser = user;

  const {
    data: profile,
    error
  } = await client
    .from("profiles")
    .select(`
      id,
      full_name,
      username,
      role,
      company_id,
      companies:company_id (
        id,
        name,
        code
      )
    `)
    .eq("id", user.id)
    .single();

  if (error) {

    alert(
      "Login successful, but profile could not be loaded.\n\n" +
      error.message
    );

    return;
  }

  currentProfile = profile;

  document.getElementById("userName").textContent =
    profile.full_name ||
    profile.username ||
    user.email;

  document.getElementById("roleName").textContent =
    profile.role;

  document.getElementById("dashboardRole").textContent =
    profile.role.toUpperCase();

  document.getElementById("companyName").textContent =
    profile.companies?.name || "No Company";

  document.getElementById("loginPage")
    .classList.add("hidden");

  document.getElementById("app")
    .classList.remove("hidden");

  await loadDashboard();

}


/* ==========================================
   DASHBOARD
========================================== */

async function loadDashboard() {

  const companyId =
    currentProfile.company_id;

  if (!companyId) {
    alert("Your account is not assigned to a company.");
    return;
  }


  /* POINTS */

  const {
    data: points,
    error: pointsError
  } = await client
    .from("fiber_points")
    .select("*")
    .eq("company_id", companyId)
    .order("created_at", {
      ascending: false
    });

  if (pointsError) {
    console.error(pointsError);
    return;
  }


  /* BOXES */

  const {
    data: boxes,
    error: boxesError
  } = await client
    .from("fiber_boxes")
    .select("id")
    .eq("company_id", companyId);

  if (boxesError) {
    console.error(boxesError);
  }


  /* LINES */

  const {
    data: lines,
    error: linesError
  } = await client
    .from("fiber_lines")
    .select("*")
    .eq("company_id", companyId)
    .order("created_at", {
      ascending: false
    });

  if (linesError) {
    console.error(linesError);
    return;
  }


  document.getElementById("pointCount")
    .textContent = points?.length || 0;

  document.getElementById("boxCount")
    .textContent = boxes?.length || 0;

  document.getElementById("lineCount")
    .textContent = lines?.length || 0;


  renderPoints(points || []);
  renderLines(lines || []);

}


/* ==========================================
   RENDER POINTS
========================================== */

function renderPoints(points) {

  const table =
    document.getElementById("pointsTable");

  if (!points.length) {

    table.innerHTML = `
      <tr>
        <td colspan="5" class="muted">
          No fiber points yet.
        </td>
      </tr>
    `;

    return;
  }

  table.innerHTML =
    points.map(point => `

      <tr>

        <td>${escapeHtml(point.name || "")}</td>

        <td>${escapeHtml(point.point_type || "Fiber Box")}</td>

        <td>${escapeHtml(point.fiber_code || "-")}</td>

        <td>
          ${point.used_cores || 0}/${point.total_cores || 0}
        </td>

        <td>
          <span class="badge">
            ${escapeHtml(point.status || "active")}
          </span>
        </td>

      </tr>

    `).join("");

}


/* ==========================================
   RENDER LINES
========================================== */

function renderLines(lines) {

  const table =
    document.getElementById("linesTable");

  if (!lines.length) {

    table.innerHTML = `
      <tr>
        <td colspan="5" class="muted">
          No fiber lines yet.
        </td>
      </tr>
    `;

    return;
  }

  table.innerHTML =
    lines.map(line => `

      <tr>

        <td>${escapeHtml(line.name || "")}</td>

        <td>${escapeHtml(line.fiber_code || "-")}</td>

        <td>
          ${line.used_cores || 0}/${line.total_cores || 0}
        </td>

        <td>
          ${line.length_meters || 0} m
        </td>

        <td>
          <span class="badge">
            ${escapeHtml(line.status || "active")}
          </span>
        </td>

      </tr>

    `).join("");

}


/* ==========================================
   ADD POINT
========================================== */

function openPointModal() {
  document
    .getElementById("pointModal")
    .classList.remove("hidden");
}

function closePointModal() {
  document
    .getElementById("pointModal")
    .classList.add("hidden");
}


async function savePoint() {

  const name =
    document.getElementById("pointName")
      .value.trim();

  const type =
    document.getElementById("pointType")
      .value;

  const code =
    document.getElementById("pointCode")
      .value.trim();

  const cores =
    Number(
      document.getElementById("pointCores")
        .value || 0
    );

  if (!name) {
    alert("Point name is required.");
    return;
  }

  const {
    error
  } = await client
    .from("fiber_points")
    .insert({
      company_id: currentProfile.company_id,
      name: name,
      point_type: type,
      fiber_code: code || null,
      total_cores: cores,
      used_cores: 0,
      status: "active",
      created_by: currentUser.id
    });

  if (error) {

    alert(error.message);
    return;

  }

  document.getElementById("pointName").value = "";
  document.getElementById("pointCode").value = "";
  document.getElementById("pointCores").value = "0";

  closePointModal();

  await loadDashboard();

}


/* ==========================================
   ADD LINE
========================================== */

function openLineModal() {
  document
    .getElementById("lineModal")
    .classList.remove("hidden");
}

function closeLineModal() {
  document
    .getElementById("lineModal")
    .classList.add("hidden");
}


async function saveLine() {

  const name =
    document.getElementById("lineName")
      .value.trim();

  const code =
    document.getElementById("lineCode")
      .value.trim();

  const cores =
    Number(
      document.getElementById("lineCores")
        .value || 0
    );

  const length =
    Number(
      document.getElementById("lineLength")
        .value || 0
    );

  if (!name) {
    alert("Line name is required.");
    return;
  }

  const {
    error
  } = await client
    .from("fiber_lines")
    .insert({
      company_id: currentProfile.company_id,
      name: name,
      fiber_code: code || null,
      total_cores: cores,
      used_cores: 0,
      length_meters: length,
      status: "active",
      created_by: currentUser.id
    });

  if (error) {

    alert(error.message);
    return;

  }

  document.getElementById("lineName").value = "";
  document.getElementById("lineCode").value = "";
  document.getElementById("lineCores").value = "0";
  document.getElementById("lineLength").value = "0";

  closeLineModal();

  await loadDashboard();

}


/* ==========================================
   LOGOUT
========================================== */

async function logout() {

  await client.auth.signOut();

  currentUser = null;
  currentProfile = null;

  document.getElementById("app")
    .classList.add("hidden");

  document.getElementById("loginPage")
    .classList.remove("hidden");

  document.getElementById("email").value = "";
  document.getElementById("password").value = "";

}


/* ==========================================
   SECURITY / HTML ESCAPE
========================================== */

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* ==========================================
   AUTH STATE
========================================== */

client.auth.onAuthStateChange(
  async (event, session) => {

    if (event === "SIGNED_OUT") {
      showLogin();
    }

  }
);


function showLogin() {

  document.getElementById("app")
    .classList.add("hidden");

  document.getElementById("loginPage")
    .classList.remove("hidden");

}
</script>

</body>
</html>
